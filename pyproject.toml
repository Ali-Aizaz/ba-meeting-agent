[project]
name = "ba-meeting-agent"
version = "0.1.0"
description = "TechSol BA joins Google Meet, answers Hey BA in chat, and saves notes and tasks to Notion."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "openai>=1.55",
  "playwright>=1.48",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ba_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: calls a real external API",
  "integration: needs Playwright Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ba_agent"]
