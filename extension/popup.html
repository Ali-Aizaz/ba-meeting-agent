<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TechSol BA</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 14px;
        color: #94a3b8;
        font-size: 12px;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      .field-label {
        display: block;
        margin-bottom: 4px;
        color: #cbd5e1;
        font-weight: 500;
      }
      input[type="url"],
      input[type="password"],
      input[type="text"],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0;
      }
      .btn {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        margin-top: 8px;
      }
      .btn-primary {
        background: #2563eb;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-secondary {
        background: #334155;
        color: #f8fafc;
      }
      .btn-secondary:hover {
        background: #475569;
      }
      .status-box {
        margin-top: 12px;
        padding: 10px;
        border-radius: 6px;
        background: #1e293b;
        border: 1px solid #334155;
        font-size: 12px;
        line-height: 1.45;
        color: #cbd5e1;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>TechSol BA</h1>
    <p class="sub">Auto-start Cloudflare Meet bot on every Google Meet</p>

    <label>
      <span class="field-label">Cloudflare Worker URL</span>
      <input
        id="workerUrl"
        type="url"
        value="https://ba-meeting-agent.aliaizazco.workers.dev"
        placeholder="https://ba-meeting-agent.aliaizazco.workers.dev"
      />
    </label>

    <label>
      <span class="field-label">Webhook Secret (optional)</span>
      <input
        id="webhookSecret"
        type="password"
        placeholder="Matches BA_WEBHOOK_SECRET if set"
      />
    </label>

    <label>
      <span class="field-label">Start Container When</span>
      <select id="triggerWhen">
        <option value="open">Opening a Meet link (faster cold-start)</option>
        <option value="joined">Only after clicking Join in Meet</option>
      </select>
    </label>

    <div class="row">
      <span>Auto-start on all Google Meets</span>
      <input id="autoStart" type="checkbox" checked />
    </div>

    <div class="row">
      <span>Auto-admit "TechSol BA" from lobby</span>
      <input id="autoAdmit" type="checkbox" checked />
    </div>

    <button id="saveBtn" class="btn btn-secondary" type="button">Save Settings</button>
    <button id="summonBtn" class="btn btn-primary" type="button">
      Summon BA to Active Meet Tab
    </button>

    <div id="statusBox" class="status-box">Status: Ready</div>

    <script src="popup.js"></script>
  </body>
</html>
